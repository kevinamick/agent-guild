# Office server. State lives in memory plus /data, so run exactly one machine.
app = "agent-guild-kevinamick"
primary_region = "iad"

[build]

[env]
  GUILD_DATA = "/data"
  GUILD_ADMIN_NAME = "Kevin"
  GUILD_OFFICE_NAME = "Kevin's Office"
  GUILD_CLIENT_URL = "https://agent-guild-eight.vercel.app"
  GUILD_PUBLIC_URL = "https://agent-guild-kevinamick.fly.dev"

[[mounts]]
  source = "guild_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
